[project]
name = "autosampler"
version = "2.0.0.dev0"
description = "Batch multisample instrument builder: slice long autosampler renders into per-(note, velocity) samples, process them, and export SFZ instruments."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "killian" }]

dependencies = [
    "numpy>=2.1",
    "scipy>=1.14",
    "soundfile>=0.12.1",
    "pyloudnorm>=0.1.1",
    "pydantic>=2.9",
    "typer>=0.15",
    "rich>=13.9",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "midiutil>=1.2.1",
    "tomli-w>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
    "scipy-stubs>=1.14",
    "types-requests>=2.32",
]

[project.scripts]
autosampler = "autosampler.cli.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autosampler"]

# ---------------------------------------------------------------- ruff

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",      # pycodestyle
    "F",           # pyflakes
    "I",           # isort
    "N",           # pep8-naming
    "UP",          # pyupgrade
    "B",           # bugbear
    "A",           # builtins shadowing
    "C4",          # comprehensions
    "SIM",         # simplify
    "TID",         # tidy imports
    "RUF",         # ruff-specific
    "ANN",         # annotations
    "D",           # pydocstyle
    "PL",          # pylint
    "NPY",         # numpy-specific
]
ignore = [
    "D105",    # magic method docstrings
    "D107",    # __init__ docstring (documented on the class)
    "D203",    # incompatible with D211
    "D213",    # incompatible with D212
    "PLR0913", # DSP functions legitimately take many parameters
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D100", "D101", "D102", "D103", "D104", "PLR2004", "ANN401"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

# ---------------------------------------------------------------- mypy

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_return_any = true
disallow_any_generics = true
no_implicit_reexport = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pyloudnorm.*", "soundfile.*", "midiutil.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "slow: tests that take more than a second",
    "e2e: end-to-end tests over the full pipeline",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src/autosampler"]
branch = true
